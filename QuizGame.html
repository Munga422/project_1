<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="QuizGame.css">
</head>
<body>
  <div class="container">
        <div class="screenactive" id ="start-active">
            <h1>QUIZ Time!</h1>
            <p>Test your knowledge with these fun questions </p>
            <button id="start-btn">Start Quiz</button>
        </div>
        

      <div class="screen" id="quiz-screen">

         <div class="quiz-header">
            <h2 id="question-text">Question goes here</h2>
            <div class="quiz-intro">
                <p>
                        Question <span id="current-question">1</span> of <span  id="total-question">5</span>
                </p>

                <p>
                    score: <span  id="score">0</span>
                </p>
            </div>
         </div>
         <div id= "answer-container" class="answer-container"></div>
         <div class="progress-bar">
            <div id="proress " class="progress"></div>
         </div>
      </div>
      
      <div id=result-screen  class="screen">
          <h1>Quiz Results</h1>
       <div class="result-intro">
        <p>you scored <span id="final-score">0</span>out of <span id="max-score">5</span></p>
        <div id="result-message">Good job!</div>
        
       </div>
      <button id="restart-btn">Restart Quiz</button>
   </div>
</div>
<script src="./QuizGame.js"></script>   
</body>
</html>
